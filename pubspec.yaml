name: tulis
description: A Notepad on steroid.

publish_to: "none"

version: 0.2.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_hooks: ^0.21.0

  # State management
  hooks_riverpod: ^3.3.2

  # Rich text editor
  flutter_quill: ^11.5.1

  # Storage
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.20.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
